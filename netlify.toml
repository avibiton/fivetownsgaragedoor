# Netlify: the site is pre-built static HTML in ./site (no build step required).
# Redirects live in site/_redirects. Keep "Pretty URLs" OFF so .html URLs are never rewritten.
[build]
  publish = "site"
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
